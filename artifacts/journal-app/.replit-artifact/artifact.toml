kind = "web"
previewPath = "/"
title = "Mental Wellness Journal"
version = "1.0.0"
id = "artifacts/journal-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23808

[services.development]
run = "pnpm --filter @workspace/journal-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/journal-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/journal-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23808"
BASE_PATH = "/"
